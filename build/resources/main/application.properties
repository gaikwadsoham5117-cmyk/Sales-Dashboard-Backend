spring.application.name=SalesDashboard
server.port=8088

# JWT
# Set JWT_SECRET as a real environment variable before running.
# Since this value was previously committed in plaintext, treat it as
# compromised and generate a brand new secret (do not reuse the old one).
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# MongoDB
# ===============================
# Local dev default stays localhost:27017. For cloud hosting, set
# MONGODB_URI to a full connection string (e.g. MongoDB Atlas free tier)
# and it overrides host/port below.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/SalesDashboard}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.org.springframework.data.mongodb.core.ReactiveMongoTemplate=DEBUG

# ===============================
# = Mail (Gmail SMTP)
# ===============================
# The previous hardcoded Gmail address/app-password here were committed in
# plaintext and must be treated as compromised - rotate that Gmail app
# password now, then set MAIL_USERNAME / MAIL_PASSWORD as env vars.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# = Tally (TallyPrime local API)
# ===============================
tally.base-url=${TALLY_BASE_URL:http://localhost:9000}
tally.company-name=${TALLY_DEFAULT_COMPANY:Soham}

# ===============================
# = Agent (public WebSocket URL handed out in downloaded agent.properties)
# = Use ws:// for local testing, wss:// once this is behind TLS.
# ===============================
agent.backend-ws-url=${AGENT_BACKEND_WS_URL:ws://192.168.1.31:5173:8088/agent-ws}