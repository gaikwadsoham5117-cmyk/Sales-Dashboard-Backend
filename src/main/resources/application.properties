spring.application.name=SalesDashboard

# ===============================
# Server
# ===============================
server.port=${PORT:8088}

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# MongoDB Atlas
# ===============================
spring.mongodb.uri=${MONGODB_URI}

logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.org.springframework.data.mongodb.core.ReactiveMongoTemplate=DEBUG

# ===============================
# Mail
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# Tally
# ===============================
tally.base-url=${TALLY_BASE_URL:http://localhost:9000}
tally.company-name=${TALLY_DEFAULT_COMPANY:Soham}

# ===============================
# Agent WebSocket
# ===============================
agent.backend-ws-url=${AGENT_BACKEND_WS_URL:ws://localhost:8088/agent-ws}